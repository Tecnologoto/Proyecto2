<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planificador de Viajes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="bg-light" data-aos-easing="ease" data-aos-duration="400" data-aos-delay="0">
    
    <header>
        <nav class="navbar navbar-expand navbar-dark bg-dark shadow-sm">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">RINCONES ESCONDIDOS</a>
                <div class="navbar-collapse justify-content-end" id="navbarNavMenu">
                    <ul class="navbar-nav flex-row">
                        <li class="nav-item me-3">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link" href="destinos.html">Destinos</a>
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link" href="experiencias.html">Experiencias</a>
                        </li>
                        <li class="nav-item me-3">
                            <a class="nav-link active" aria-current="page" href="contacto.html">Planificador</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="faq.html">FAQ</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <section class="text-center mb-5" data-aos="fade-up">
            <h1 class="display-4 fw-bold text-dark">Planificador de Viajes</h1>
            <p class="lead text-muted">Personaliza tu próxima aventura o reserva tu experiencia turística con nosotros.</p>
        </section>

        <div class="row justify-content-center">
            <div class="col-xl-8 col-lg-10 col-md-12" data-aos="fade-up" data-aos-delay="200">
                <div class="card shadow-sm border-0 p-4 bg-white">
                    <div class="card-body">
                        
                        <div id="mensajeAlerta" class="alert d-none" role="alert"></div>

                        <form id="formPlanificador" novalidate>
                            
                            <div class="mb-3">
                                <label for="nombreUsuario" class="form-label fw-bold text-secondary">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombreUsuario" placeholder="Ej. Ana Pérez" required>
                            </div>

                            <div class="mb-3">
                                <label for="emailUsuario" class="form-label fw-bold text-secondary">Correo Electrónico</label>
                                <input type="email" class="form-control" id="emailUsuario" placeholder="correo@ejemplo.com" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label for="destinoSelect" class="form-label fw-bold text-secondary">Destino de Interés</label>
                                    <select class="form-select" id="destinoSelect" required>
                                        <option value="" selected disabled>Selecciona una región...</option>
                                        <option value="sierra">Ruta de Senderismo - Sierra</option>
                                        <option value="pueblo">Pueblo Mágico y Cultura</option>
                                        <option value="costa">Aventura en la Costa</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaViaje" class="form-label fw-bold text-secondary">Fecha Estimada</label>
                                    <input type="date" class="form-control" id="fechaViaje" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="detallesTextarea" class="form-label fw-bold text-secondary">Requerimientos o Comentarios Adicionales</label>
                                <textarea class="form-control" id="detallesTextarea" rows="4" placeholder="Indícanos si requieres guía certificado, transporte o necesidades especiales..."></textarea>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold">Enviar Planificador</button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <small>© 2026 RINCONES ESCONDIDOS - Proyecto Integrador de Turismo. Todos los derechos reservados.</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="script.js"></script>
</body>
</html>
